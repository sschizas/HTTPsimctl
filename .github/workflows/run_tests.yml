name: Run tests

on:
  pull_request

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Xcode 27)
    # Package.swift needs swift-tools-version 6.4, which ships with Xcode 27 (arm64 only image).
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      # On macOS the Swift version is whatever the selected Xcode ships, so no setup-swift step is needed.
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - uses: actions/cache@v6
        with:
          path: .build
          # .build is toolchain specific, so key it on the image as well.
          key: xcode-27-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            xcode-27-spm-
      - name: Run tests
        run: swift test

  danger:
    name: 🚧 Danger
    # Pinned: `ubuntu-latest` is migrating to Ubuntu 26, which shouldn't change Danger's behaviour under us.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          # Installs the Gemfile's gems and caches them.
          bundler-cache: true
      - name: Run danger
        run: bundle exec danger
        env:
          # The workflow token (see `permissions` above) can read the PR and post Danger's comment,
          # so no personal access token is needed.
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
