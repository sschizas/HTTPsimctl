name: Build and create release

permissions:
  contents: write

on:
  push:
    tags:
      - '*'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Package.swift needs swift-tools-version 6.4, which ships with Xcode 27 (arm64 only image).
    # The image's default Xcode is 27, so no setup-xcode step is needed.
    runs-on: xcode-27
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Cache SPMs
        uses: actions/cache@v6
        with:
          path: .build
          # .build is toolchain specific, so key it on the image as well.
          key: xcode-27-spm-release-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            xcode-27-spm-release-
      - name: Build binary
        # Universal binary. Xcode 27 warns that x86_64 is deprecated; it still builds.
        run: xcrun swift build -c release --arch arm64 --arch x86_64
      - name: Compress archive
        run: |
          # The output directory differs between SwiftPM build systems, so ask for it.
          BIN_PATH="$(xcrun swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          cd "$BIN_PATH"
          # The executable target is named App.
          mv App httpsimctl
          tar -czf httpsimctl.tar.gz ./httpsimctl
          echo "ARCHIVE_PATH=$BIN_PATH/httpsimctl.tar.gz" >> "$GITHUB_ENV"
      - name: Upload zip binary
        uses: actions/upload-artifact@v6
        with:
          name: httpsimctl.tar.gz
          path: ${{ env.ARCHIVE_PATH }}
          retention-days: 1

  create_release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Download zip binary
        uses: actions/download-artifact@v7
        with:
          name: httpsimctl.tar.gz
      - name: Get release notes
        id: release_notes
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: query
          version: ${{ github.ref_name }}
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.release_notes.outputs.release-notes }}
          draft: false
          prerelease: false
          files: httpsimctl.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: create_release
    name: Bump Homebrew formula
    # Skip prerelease tags such as 1.8.0-rc1.
    if: ${{ !contains(github.ref, '-') }}
    runs-on: ubuntu-latest
    # The job authenticates with COMMITTER_TOKEN, so the workflow token only needs read access.
    permissions:
      contents: read
    steps:
      - uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: httpsimctl
          formula-path: Formula/httpsimctl.rb
          homebrew-tap: sschizas/homebrew-formulae
          base-branch: main
          download-url: https://github.com/sschizas/HTTPsimctl/releases/download/${{ github.ref_name }}/httpsimctl.tar.gz
          commit-message: |
            {{formulaName}} {{version}}
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}